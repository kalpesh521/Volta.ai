# Volta.ai — full stack in one command:
#
#   docker compose up -d --build        # build images, start everything in dependency order
#   docker compose ps                   # health of every service
#   docker compose logs -f api          # follow one service
#   docker compose down                 # stop (data kept)    |  down -v  = also wipe all data
#
# Startup order (enforced by healthchecks, not sleeps):
#   postgres / timescaledb / redis / rabbitmq  ->  migrate (alembic, runs once)
#     ->  api  ->  ingest-worker, device-worker, simulator
#
# URLs once up (host ports are overridable in .env, see .env.example):
#   API + docs        http://127.0.0.1:8000/docs        Energy console  http://127.0.0.1:8000/ui/energy
#   Live dashboard    http://127.0.0.1:8765             RabbitMQ UI     http://127.0.0.1:15672
#
# Config: secrets and AI keys come from backend/.env (optional, gitignored).
# Service hostnames below always win over any localhost values in that file.
# Infra ports are published on 127.0.0.1 only. Never expose them on a public interface.

name: volta

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Settings shared by every Python service built from backend/Dockerfile.
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: volta-backend:local
  env_file:
    - path: backend/.env
      required: false
  environment: &backend-env
    ENVIRONMENT: ${APP_ENV:-development}
    DATABASE_URL: postgresql+asyncpg://volta:${POSTGRES_PASSWORD:-volta}@postgres:5432/volta_auth
    DB_SSL_REQUIRED: "false"
    TIMESCALE_DATABASE_URL: postgresql+asyncpg://volta:${TIMESCALE_PASSWORD:-volta}@timescaledb:5432/volta_ts
    TIMESCALE_SSL_REQUIRED: "false"
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://volta:${RABBITMQ_PASSWORD:-volta}@rabbitmq:5672/volta
    INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
    TELEMETRY_IO_ENABLED: "true"
    # Pending device confirmations must survive restarts and be visible to every replica.
    AI_CHECKPOINT_BACKEND: postgres
    # Shared rate-limit counters. Database 1: database 0 holds the live telemetry snapshot.
    RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  restart: unless-stopped
  logging: *default-logging
  networks: [volta]

services:
  # ---------------------------------------------------------------- data stores
  postgres:
    # Auth / onboarding / knowledge DB. pgvector is required by the knowledge migration.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: volta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volta}
      POSTGRES_DB: volta_auth
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volta -d volta_auth"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: [volta]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: volta
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-volta}
      POSTGRES_DB: volta_ts
    ports:
      - "127.0.0.1:${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volta -d volta_ts"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: [volta]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [volta]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: volta
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-volta}
      RABBITMQ_DEFAULT_VHOST: volta
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # The Erlang CLI is slow to boot on a busy host; keep the timeout generous.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [volta]

  # ---------------------------------------------------------------- app services
  migrate:
    # One-shot: apply Alembic migrations and create the LangGraph checkpoint tables, then exit 0.
    # Everything else waits for it.
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.ai.checkpointer setup"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # Prometheus scrape target at /metrics. It is unauthenticated: the port is bound to
      # 127.0.0.1 above, keep it that way or put it behind your own access control.
      METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - knowledge_data:/srv/volta/backend/var/knowledge
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  ingest-worker:
    # RabbitMQ -> TimescaleDB + Redis. Scale with: docker compose up -d --scale ingest-worker=3
    # Each replica serves its own /metrics on :9100 inside the compose network.
    <<: *backend
    environment:
      <<: *backend-env
      WORKER_METRICS_PORT: "9100"
    command: ["python", "-m", "app.workers.ingest"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  device-worker:
    # Audit consumer for virtual device commands (confirm-before-act flow).
    <<: *backend
    environment:
      <<: *backend-env
      WORKER_METRICS_PORT: "9100"
    command: ["python", "-m", "app.workers.device_commands"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  action-maintenance:
    # Hourly housekeeping: expire unanswered device-action proposals, prune old action checkpoints,
    # and delete chat conversations idle past AI_CONVERSATION_RETENTION_DAYS with their memory.
    # Must run at least once per ACTION_CHECKPOINT_RETENTION_HOURS (default 24).
    <<: *backend
    command:
      - sh
      - -c
      - "while true; do python -m app.modules.assistant.actions.maintenance || true; python -m app.agents_platform.maintenance || true; sleep 3600; done"
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256m

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    image: volta-simulator:local
    environment:
      RABBITMQ_URL: amqp://volta:${RABBITMQ_PASSWORD:-volta}@rabbitmq:5672/volta
      BACKEND_URL: http://api:8000
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      WEATHER_MODE: ${SIMULATOR_WEATHER_MODE:-live}
      # Homes come from completed onboarding; new ones are picked up while running.
      FROM_ONBOARDING: "false"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8765}:8765"
    volumes:
      - simulator_data:/srv/volta/simulator/data
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks: [volta]
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  volta:
    name: volta

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  rabbitmq_data:
  knowledge_data:
  simulator_data:
